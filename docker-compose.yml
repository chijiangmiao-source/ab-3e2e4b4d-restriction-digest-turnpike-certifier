name: turnpike

services:
  api:
    build: .
    image: turnpike-api
    ports:
      # Host port is overridable: API_PORT=9000 docker compose up api
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  # One-shot acceptance service: waits for a healthy API, runs verify.py
  # against it, then exits (0 = all checks passed).
  verify:
    build: .
    image: turnpike-api
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_BASE_URL: http://api:8000
    command: ["python", "verify.py"]
    restart: "no"
